<!doctype html>

<meta charset="utf-8">
<title>Manual Review — improvement</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #6b7280;
    --border: #e2e2e2;
    --panel: #f7f7f8;
    --accent: #2563eb;
    --danger: #dc2626;
    --ok: #16a34a;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--fg);
    margin: 0;
    padding: 0 0 4rem 0;
  }
  header.toolbar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 0.75rem 1.25rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    flex-wrap: wrap;
  }
  header.toolbar h1 { font-size: 1rem; margin: 0; margin-right: auto; font-weight: 600; }
  header.toolbar .sub { color: var(--muted); font-size: 0.8rem; }

  /* Dropdown checkbox panels (metadata columns, per-column identity filters)
     -- mirrors compare.html's meta-selector pattern. */
  .dropdown-wrap { position: relative; }
  /* Filter buttons are built dynamically (one per configured identity
     column) into this container; display:contents makes its .dropdown-wrap
     children behave as direct flex items of header.toolbar, same as if
     they were still hardcoded there. */
  #filterPanelsContainer { display: contents; }
  .dropdown-panel {
    display: none;
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    z-index: 20;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,.12);
    padding: 0.5rem;
    min-width: 12rem;
    max-height: 16rem;
    overflow-y: auto;
    font-size: 0.8rem;
  }
  .dropdown-panel.open { display: block; }
  .dropdown-check-item { display: flex; align-items: center; gap: 0.4rem; padding: 0.2rem 0.3rem; border-radius: 4px; }
  .dropdown-check-item:hover { background: var(--panel); }
  .dropdown-check-item label { cursor: pointer; flex: 1; }
  .dropdown-panel .empty-hint { color: var(--muted); padding: 0.2rem 0.3rem; }
  button {
    font: inherit;
    cursor: pointer;
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 6px;
    padding: 0.4rem 0.75rem;
  }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.primary:hover { background: #1d4ed8; }
  button:hover { background: var(--panel); }
  button.danger { color: var(--danger); border-color: var(--danger); }
  button.small { padding: 0.15rem 0.45rem; font-size: 0.75rem; }
  button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { cursor: not-allowed; opacity: 0.5; background: #fff; }
  button:disabled:hover { background: #fff; }
  select, input[type=text] { font: inherit; padding: 0.2rem 0.3rem; border-radius: 4px; border: 1px solid var(--border); }
  input.tag-input { width: 11rem; }

  #banner { display: none; background: #fff8e1; border-bottom: 1px solid #e6d17a; padding: 0.6rem 1.25rem; font-size: 0.85rem; }
  #banner.show { display: flex; gap: .75rem; align-items: center; }

  main { max-width: 900px; margin: 1.25rem auto; padding: 0 1.25rem; }

  details.document { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 1rem; overflow: visible; }
  details.document > summary {
    list-style: none; cursor: pointer; padding: 0.65rem 1rem; background: var(--panel);
    display: flex; align-items: center; gap: 0.6rem; font-weight: 600;
  }
  details.document > summary::-webkit-details-marker { display: none; }
  details.document > summary::before { content: "▶"; font-size: 0.7rem; color: var(--muted); transition: transform 0.1s; }
  details.document[open] > summary::before { transform: rotate(90deg); }
  .doc-progress { margin-left: auto; font-size: 0.78rem; font-weight: 400; color: var(--muted); }
  .doc-progress.complete { color: var(--ok); font-weight: 600; }

  .doc-body { padding: 0.9rem 1rem 1.1rem; }

  .paragraph { margin-bottom: 1.3rem; padding-bottom: 1rem; border-bottom: 1px solid #f0f0f0; }
  .paragraph:last-child { margin-bottom: 0; border-bottom: none; padding-bottom: 0; }

  .para-head {
    display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.3rem;
    font-size: 0.75rem; color: var(--muted);
  }
  .para-head .pnum { font-variant-numeric: tabular-nums; }
  .para-fold-toggle {
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    font-size: 0.7rem;
    color: var(--muted);
    flex-shrink: 0;
    line-height: 1;
  }
  .para-fold-toggle::before {
    content: "\25bc";
    display: inline-block;
    transition: transform 0.1s;
  }
  .paragraph.collapsed .para-fold-toggle::before {
    transform: rotate(-90deg);
  }
  .para-head label.reviewed, .para-head label.exclude {
    margin-left: auto; display: flex; align-items: center; gap: 0.3rem;
    cursor: pointer; user-select: none;
  }
  .para-head label.exclude { margin-left: 0.75rem; }
  .para-head label.reviewed input, .para-head label.exclude input { cursor: pointer; }
  .para-head label.reviewed input:disabled, .para-head label.exclude input:disabled { cursor: not-allowed; }
  .para-head.done { color: var(--ok); }
  .para-head.excluded { color: var(--danger); }
  .para-meta-field { display: none; white-space: nowrap; }
  .para-meta-field.show { display: inline; }
  .para-meta-field b { font-weight: 600; }

  .ptext {
    line-height: 1.65;
    padding: 0.5rem 0.6rem;
    border: 1px dashed transparent;
    border-radius: 6px;
    user-select: text;
  }
  .ptext.excluded-text { color: var(--muted); }
  .ptext.selecting { border-color: var(--accent); background: #eff6ff; cursor: crosshair; }
  .ptext.move-target { border-color: #ea580c; border-style: dashed; }

  /* Collapsed (Reviewed or Excluded): truncate text to one line, hide
     badges/metadata, keep the para-head (number + checkboxes) visible. */
  .paragraph.collapsed .ptext {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }
  .paragraph.collapsed .badges {
    display: none;
  }
  .paragraph.collapsed .para-meta-field {
    display: none;
  }

  /* Highlighted span in the text: no visible label, plain text only (no
     nested children) so native drag-selection across/into it is never at
     risk of being confused by hidden nested content. Hover tooltip is a
     single shared element positioned via JS, not nested per-mark. */
  span.quote {
    cursor: help;
    padding: 2px 0;
    border-radius: 3px;
    transition: filter 0.15s;
  }
  span.quote:hover { filter: brightness(0.88) saturate(1.3); }
  span.quote.flash {
    outline: 3px solid #f59e0b;
    outline-offset: 1px;
    filter: brightness(1.3) saturate(1.5);
  }
  #shared-tooltip {
    display: none;
    position: fixed;
    z-index: 1000;
    background: #333;
    color: #fff;
    border-radius: 6px;
    padding: 4px 0;
    box-shadow: 0 2px 8px rgba(0,0,0,.3);
    min-width: 140px;
    font-size: 0.78rem;
    pointer-events: none;
    transform: translate(-50%, -100%);
  }
  #shared-tooltip.show { display: block; }
  .quote-tooltip-tag { padding: 4px 10px; display: flex; align-items: center; gap: 8px; }
  .quote-tooltip-color { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
  .quote-tooltip-tag.undefined .quote-tooltip-color { border: 2px dashed #333; }
  .quote-tooltip-tag.system .quote-tooltip-color { border: 2px dotted #333; }

  /* Badge list under each paragraph, in text order */
  .badges { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 0.45rem; }
  .tag-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 0.78rem;
    color: #fff;
    cursor: pointer;
    border: 2px solid transparent;
    line-height: 1.6;
  }
  .tag-badge.deleted { display: none; }
  .tag-badge .status-dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.9); }
  .tag-badge.open { border-color: #111; }
  .tag-badge.locked { opacity: 0.55; cursor: not-allowed; }
  .tag-badge.undefined { border: 2px dashed #333; }
  .tag-badge.undefined.open { border-color: #111; }
  .tag-badge.system { border: 2px dotted #333; }
  .tag-badge.system.open { border-color: #111; }
  .tag-badge.flash { outline: 3px solid #f59e0b; outline-offset: 1px; filter: brightness(1.15); }

  .edit-panel {
    margin-top: 0.5rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    padding: 0.6rem 0.7rem;
    font-size: 0.82rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    flex-wrap: wrap;
  }
  .edit-panel .status-label {
    font-size: 0.7rem; padding: 0.1rem 0.5rem; border-radius: 999px; color: #fff;
  }
  .edit-panel .pos { color: var(--muted); font-variant-numeric: tabular-nums; }
  .edit-panel .spacer { flex: 1 1 auto; }

  .add-toolbar {
    display: none; position: sticky; top: 3.1rem; z-index: 9; background: #eff6ff;
    border-bottom: 1px solid #bfdbfe; padding: 0.5rem 1.25rem; align-items: center; gap: 0.6rem; font-size: 0.85rem;
  }
  .add-toolbar.show { display: flex; }

  footer.savebar {
    position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg); border-top: 1px solid var(--border);
    padding: 0.6rem 1.25rem; display: flex; align-items: center; gap: 0.75rem; font-size: 0.8rem; color: var(--muted);
  }
  #toast {
    position: fixed; bottom: 3.6rem; right: 1.25rem; background: #111827; color: #fff; padding: 0.5rem 0.9rem;
    border-radius: 6px; font-size: 0.8rem; opacity: 0; transform: translateY(6px);
    transition: opacity .15s, transform .15s; pointer-events: none;
  }
  #toast.show { opacity: 1; transform: translateY(0); }

  .legend { display: flex; gap: 0.9rem; flex-wrap: wrap; font-size: 0.75rem; color: var(--muted); margin: 0 0 1rem; }
  .legend span { display: inline-flex; align-items: center; gap: 0.3rem; }
  .legend .dot { width: 0.6rem; height: 0.6rem; border-radius: 50%; }
</style>
</head>

<script>
(function () {
  "use strict";

  const STATUS_LABELS = {
    original: "original",
    created: "created",
    deleted: "deleted",
    changed_position: "moved",
    changed_tag: "retagged",
    changed_position_and_tag: "moved+retagged",
  };
  const STATUS_COLORS = {
    original: "#6b7280",
    created: "#16a34a",
    deleted: "#dc2626",
    changed_position: "#ea580c",
    changed_tag: "#2563eb",
    changed_position_and_tag: "#7c3aed",
  };

  const reviewData = JSON.parse(document.getElementById("review-data").textContent);
  const tagList = JSON.parse(document.getElementById("tag-list").textContent); // [{name, color, additional_tag, system}]
  const tagMetaByName = {};
  tagList.forEach((t) => {
    tagMetaByName[t.name] = { color: t.color, additional: !!t.additional_tag, system: !!t.system };
  });

  function hashHue(tag) {
    let h = 0;
    for (let i = 0; i < tag.length; i++) h = (h * 31 + tag.charCodeAt(i)) >>> 0;
    return h % 360;
  }
  function hexToRgba(hex, alpha) {
    hex = (hex || "").replace("#", "");
    if (hex.length !== 6) return `rgba(128, 128, 128, ${alpha})`;
    const r = parseInt(hex.slice(0, 2), 16);
    const g = parseInt(hex.slice(2, 4), 16);
    const b = parseInt(hex.slice(4, 6), 16);
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
  }
  // Looks up a tag's color/undefined-ness. Tags typed in at edit time that
  // never appeared in the generated data (so aren't in tagMetaByName at all)
  // are treated as undefined too, with a deterministic hash-based color.
  function tagInfo(tag) {
    const known = tagMetaByName[tag];
    if (known) return known;
    return { color: `hsl(${hashHue(tag)}, 60%, 48%)`, additional: true, system: false };
  }
  // Solid color for badges: the tag's real codebook color, falling back to a
  // deterministic hash-based hue for tags without one (e.g. undefined tags).
  function tagColor(tag) {
    return tagInfo(tag).color;
  }
  // Translucent tint for text highlights, same color source as tagColor().
  // tagInfo().color is a hex string for known tags, or a synthesized
  // hsl(...) string for unknown ones (see tagInfo()) -- handle both.
  function tagRgba(tag, alpha) {
    const color = tagInfo(tag).color;
    return color.startsWith("#")
      ? hexToRgba(color, alpha)
      : color.replace("hsl(", "hsla(").replace(")", `, ${alpha})`);
  }
  // Mirrors report/html.py's _build_background_style: a single tint for one tag,
  // or equal-height horizontal stripes (one per tag) when several tags cover
  // the same text segment, so overlapping tags stay visually distinguishable.
  function buildStripeBackground(tagNames) {
    if (tagNames.length === 0) return "transparent";
    if (tagNames.length === 1) return tagRgba(tagNames[0], 0.35);
    const stripeHeight = 100 / tagNames.length;
    const parts = tagNames.map(
      (t, i) => `${tagRgba(t, 0.35)} ${i * stripeHeight}%, ${tagRgba(t, 0.35)} ${(i + 1) * stripeHeight}%`
    );
    return `linear-gradient(to bottom, ${parts.join(", ")})`;
  }

  const state = {
    metadata: reviewData.metadata,
    paragraphChecks: reviewData.paragraph_checks,
    records: reviewData.records,
    documents: JSON.parse(document.getElementById("document-texts").textContent),
    tags: tagList.map((t) => t.name), // all tags seen (defined + undefined), for autocomplete
    definedTags: tagList.filter((t) => !t.additional_tag).map((t) => t.name), // codebook only, for the dropdowns
  };
  const metaColumns = JSON.parse(document.getElementById("meta-columns").textContent); // [{col, label}]
  // docName -> {<key_column>: value, ..., condition: value}; resolved server-side
  // by build_document_identity() in src/post_processing/review_page.py, so this page never
  // re-derives identity from a name.
  const documentIdentity = JSON.parse(document.getElementById("document-identity").textContent);
  const filterColumns = JSON.parse(document.getElementById("filter-columns").textContent); // [{col, label}]
  const displayLabel = JSON.parse(document.getElementById("display-label").textContent);
  const MODE = JSON.parse(document.getElementById("mode").textContent); // "full" or "restricted"
  function identityOf(docName) {
    return documentIdentity[docName] || {};
  }

  const STORAGE_KEY = "quallm-manual-review-" + state.metadata.prefix;
  let fileHandle = null;
  let nextIdCounter = 1;
  let addMode = false;
  let moveTargetId = null;
  let openPanelId = null; // id of the record whose edit panel is currently open
  let manualOverride = {};
  // Per-paragraph fold state set via the fold-toggle arrow, independent of
  // (and overriding) the checked/excluded-derived default -- mirrors
  // compare.html's paraCollapsedOverride. Cleared whenever Reviewed/Exclude
  // changes so the paragraph falls back to the derived default.
  const paraCollapsedOverride = {};
  let activeMetaColumns = new Set(); // which metadata columns are currently shown
  // One entry per filterColumns column; each value is a Set of allowed
  // values for that column (empty Set = show all).
  const activeFilters = new Map(filterColumns.map(({ col }) => [col, new Set()]));

  const docsEl = document.getElementById("docs");
  const legendEl = document.getElementById("legend");
  const addToolbar = document.getElementById("addToolbar");
  const addTagInput = document.getElementById("addTagInput");
  const addTagSelectDefined = document.getElementById("addTagSelectDefined");
  const toast = document.getElementById("toast");

  // Single shared hover tooltip (not nested inside each mark) so a mark's
  // DOM is plain text only -- never at risk of confusing native
  // drag-selection with hidden nested content.
  const sharedTooltip = document.createElement("div");
  sharedTooltip.id = "shared-tooltip";
  document.body.appendChild(sharedTooltip);

  function showSharedTooltip(markEl) {
    const tags = markEl.dataset.tags.split(",");
    sharedTooltip.innerHTML = tags
      .map((t) => {
        const info = tagInfo(t);
        const cls = (info.additional ? " undefined" : "") + (info.system ? " system" : "");
        return `<div class="quote-tooltip-tag${cls}"><span class="quote-tooltip-color" style="background:${tagColor(t)}"></span>${escapeHtml(t)}</div>`;
      })
      .join("");
    const rect = markEl.getBoundingClientRect();
    sharedTooltip.style.left = rect.left + rect.width / 2 + "px";
    sharedTooltip.style.top = rect.top - 6 + "px";
    sharedTooltip.classList.add("show");
  }
  function hideSharedTooltip() {
    sharedTooltip.classList.remove("show");
  }

  // Populates a <select> with defined (codebook) tags only, preselecting
  // currentValue if it's one of them, and wires changing it to fill (and
  // trigger the change handler of) targetInput -- the dropdown is just a
  // shortcut for the free-text input, which remains the single source of
  // truth and still accepts any typed name.
  function wireDefinedTagSelect(select, targetInput, currentValue) {
    select.innerHTML = "";
    const placeholder = document.createElement("option");
    placeholder.value = "";
    placeholder.textContent = "— pick a defined tag —";
    placeholder.disabled = true;
    select.appendChild(placeholder);
    let matched = false;
    state.definedTags.forEach((t) => {
      const opt = document.createElement("option");
      opt.value = t;
      opt.textContent = t;
      if (t === currentValue) {
        opt.selected = true;
        matched = true;
      }
      select.appendChild(opt);
    });
    placeholder.selected = !matched;
    select.onchange = () => {
      if (!select.value) return;
      targetInput.value = select.value;
      targetInput.dispatchEvent(new Event("change", { bubbles: true }));
    };
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove("show"), 2200);
  }

  function paraCheck(docName, rowNum) {
    return state.paragraphChecks.find(
      (p) => p.source_name === docName && p.row === rowNum
    );
  }

  function activeRecords(docName, rowNum) {
    return state.records
      .filter((r) => r.source_name === docName && r.row === rowNum && r.status !== "deleted")
      .filter((r) => state.metadata.render_undefined_tags || !tagInfo(r.tag).additional)
      .filter((r) => state.metadata.show_system_tags || !tagInfo(r.tag).system)
      .sort((a, b) => a.start - b.start || a.end - b.end);
  }

  function docParaChecks(docName) {
    return state.paragraphChecks.filter((p) => p.source_name === docName);
  }

  function isDocFullyChecked(docName) {
    const checks = docParaChecks(docName);
    return checks.length > 0 && checks.every((p) => p.checked || p.excluded);
  }

  // Restricted-mode (Step 1 undefined-tags review) permission gating: only
  // records flagged is_target (server-computed, see build_step1_target_records()
  // in src/post_processing/undefined_tags.py) may be edited while the "Restrict to
  // undefined tags" toggle is on -- everything else stays frozen alongside
  // the existing paragraph-level (Reviewed/Exclude) lock.
  function isTargetGatingActive() {
    return MODE === "restricted" && !!state.metadata.restrict_to_target_tags;
  }
  function recordLocked(r, paraLocked) {
    return paraLocked || (isTargetGatingActive() && !r.is_target);
  }

  function markStatusOnTagChange(r) {
    if (r.status === "original") r.status = "changed_tag";
    else if (r.status === "changed_position") r.status = "changed_position_and_tag";
  }
  function markStatusOnPositionChange(r) {
    if (r.status === "original") r.status = "changed_position";
    else if (r.status === "changed_tag") r.status = "changed_position_and_tag";
  }

  function persistLocal() {
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify({
        savedAt: Date.now(),
        metadata: state.metadata,
        paragraph_checks: state.paragraphChecks,
        records: state.records,
      })
    );
  }

  function render() {
    legendEl.innerHTML = Object.keys(STATUS_LABELS)
      .filter((s) => s !== "deleted")
      .map((s) => `<span><span class="dot" style="background:${STATUS_COLORS[s]}"></span>${STATUS_LABELS[s]}</span>`)
      .join("");

    docsEl.innerHTML = "";
    let shownCount = 0;
    Object.keys(state.documents).forEach((docName) => {
      const identity = identityOf(docName);
      for (const [col, activeSet] of activeFilters) {
        if (activeSet.size && !activeSet.has(identity[col])) return;
      }
      shownCount++;

      const fullyChecked = isDocFullyChecked(docName);
      const shouldOpen = docName in manualOverride ? manualOverride[docName] : !fullyChecked;

      const details = document.createElement("details");
      details.className = "document";
      details.open = shouldOpen;
      details.dataset.doc = docName;
      details.addEventListener("toggle", () => { manualOverride[docName] = details.open; });

      const checks = docParaChecks(docName);
      const checkedCount = checks.filter((p) => p.checked || p.excluded).length;

      const summary = document.createElement("summary");
      summary.innerHTML = `<span>${docName}</span><span class="doc-progress ${fullyChecked ? "complete" : ""}">${checkedCount}/${checks.length} ${displayLabel} reviewed${fullyChecked ? " · fully reviewed" : ""}</span>`;
      details.appendChild(summary);

      const body = document.createElement("div");
      body.className = "doc-body";
      state.documents[docName].paragraphs.forEach((p) => body.appendChild(renderParagraph(docName, p)));
      details.appendChild(body);
      docsEl.appendChild(details);
    });

    document.getElementById("countDocsShown").textContent = shownCount;
    document.getElementById("countDocsTotal").textContent = Object.keys(state.documents).length;
    document.getElementById("countTotal").textContent = state.records.filter((r) => r.status !== "deleted").length;
    document.getElementById("countDeleted").textContent = state.records.filter((r) => r.status === "deleted").length;
    document.getElementById("countParaChecked").textContent = state.paragraphChecks.filter((p) => p.checked || p.excluded).length;
    document.getElementById("countParaTotal").textContent = state.paragraphChecks.length;
    document.getElementById("countParaExcluded").textContent = state.paragraphChecks.filter((p) => p.excluded).length;
  }

  function renderParagraph(docName, paragraph) {
    const wrap = document.createElement("div");

    const active = activeRecords(docName, paragraph.row);
    const check = paraCheck(docName, paragraph.row);
    const excluded = !!(check && check.excluded);
    // "Reviewed" is effectively true whenever "Exclude" is checked too --
    // this is a derived OR, not a stored fact, so it can never go stale
    // (see the design note in the implementation plan for why mutating
    // check.checked from the Exclude handler was rejected).
    const locked = !!(check && (check.checked || excluded));
    const paraKey = docName + ":" + paragraph.row;
    const collapsed = paraKey in paraCollapsedOverride ? paraCollapsedOverride[paraKey] : locked;
    wrap.className = "paragraph" + (collapsed ? " collapsed" : "");

    // --- paragraph header: fold toggle + number + metadata fields (toggled
    // via the Metadata dropdown) + reviewed/exclude checkboxes (both lock
    // editing) ---
    const head = document.createElement("div");
    head.className = "para-head" + (locked ? " done" : "") + (excluded ? " excluded" : "");

    const foldToggle = document.createElement("button");
    foldToggle.type = "button";
    foldToggle.className = "para-fold-toggle";
    foldToggle.setAttribute("aria-label", "Toggle " + displayLabel);
    foldToggle.addEventListener("click", () => {
      paraCollapsedOverride[paraKey] = !collapsed;
      render();
    });
    head.appendChild(foldToggle);

    let headHtml = `<span class="pnum">${displayLabel}: ${paragraph.paragraph}</span>`;
    const meta = paragraph.meta || {};
    metaColumns.forEach(({ col, label: colLabel }) => {
      const value = meta[col];
      if (!value) return;
      headHtml += `<span class="para-meta-field${activeMetaColumns.has(col) ? " show" : ""}" data-col="${escapeAttr(col)}"><b>${escapeHtml(colLabel)}:</b> ${escapeHtml(value)}</span>`;
    });
    head.insertAdjacentHTML("beforeend", headHtml);

    const label = document.createElement("label");
    label.className = "reviewed";
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = locked;
    cb.disabled = excluded;
    cb.addEventListener("change", () => {
      check.checked = cb.checked;
      if (check.checked && openPanelId && active.some((r) => r.id === openPanelId)) {
        openPanelId = null;
      }
      delete paraCollapsedOverride[paraKey];
      persistLocal();
      render();
    });
    label.appendChild(cb);
    let reviewedText = "Reviewed";
    if (excluded) reviewedText = "Reviewed (excluded)";
    else if (locked) reviewedText = "Reviewed (locked)";
    label.appendChild(document.createTextNode(reviewedText));
    head.appendChild(label);

    const excludeLabel = document.createElement("label");
    excludeLabel.className = "exclude";
    const cbExclude = document.createElement("input");
    cbExclude.type = "checkbox";
    cbExclude.checked = excluded;
    cbExclude.addEventListener("change", () => {
      check.excluded = cbExclude.checked;
      if (check.excluded && openPanelId && active.some((r) => r.id === openPanelId)) {
        openPanelId = null;
      }
      delete paraCollapsedOverride[paraKey];
      persistLocal();
      render();
    });
    excludeLabel.appendChild(cbExclude);
    excludeLabel.appendChild(document.createTextNode(excluded ? "Excluded" : "Exclude"));
    head.appendChild(excludeLabel);

    wrap.appendChild(head);

    // --- highlighted text: split into non-overlapping segments at every tag
    // boundary (mirrors report/html.py's _render_paragraph_html), so every
    // character of paragraph.text is emitted exactly once, even where two
    // tags overlap only partially. A segment covered by >1 tag gets a
    // striped background instead of picking just one tag's color. ---
    const text = paragraph.text;
    const base = paragraph.start_position;

    const span = (r) => {
      const s = Math.min(Math.max(r.start - base, 0), text.length);
      const e = Math.min(Math.max(r.end - base, 0), text.length);
      return [s, e];
    };

    const boundarySet = new Set([0, text.length]);
    active.forEach((r) => {
      const [s, e] = span(r);
      if (s < e) {
        boundarySet.add(s);
        boundarySet.add(e);
      }
    });
    const boundaries = Array.from(boundarySet).sort((a, b) => a - b);

    let html = "";
    for (let i = 0; i < boundaries.length - 1; i++) {
      const segStart = boundaries[i];
      const segEnd = boundaries[i + 1];
      const segText = text.slice(segStart, segEnd);
      const segActive = active.filter((r) => {
        const [s, e] = span(r);
        return s <= segStart && segEnd <= e;
      });
      if (segActive.length === 0) {
        html += escapeHtml(segText);
        continue;
      }
      const seenTags = new Set();
      const segTags = [];
      segActive.forEach((r) => {
        if (!seenTags.has(r.tag)) {
          seenTags.add(r.tag);
          segTags.push(r.tag);
        }
      });
      const bg = buildStripeBackground(segTags);
      const ids = segActive.map((r) => r.id).join(",");
      // Plain text content only (no nested tooltip element) -- see
      // showSharedTooltip()/sharedTooltip for why the tooltip lives outside
      // the mark instead.
      html += `<span class="quote" data-ids="${escapeAttr(ids)}" data-tags="${escapeAttr(segTags.join(","))}" style="background:${bg}">${escapeHtml(segText)}</span>`;
    }

    const ptext = document.createElement("div");
    ptext.className = "ptext" +
      (moveTargetId && active.some((r) => r.id === moveTargetId) ? " move-target" : "") +
      (excluded ? " excluded-text" : "");
    ptext.dataset.doc = docName;
    ptext.dataset.row = String(paragraph.row);
    ptext.dataset.base = String(base);
    ptext.innerHTML = html;
    wrap.appendChild(ptext);

    // hovering a highlighted span shows the shared tooltip; clicking it
    // scrolls to + flashes the badge(s) active there
    ptext.querySelectorAll("span.quote").forEach((m) => {
      m.addEventListener("mouseenter", () => showSharedTooltip(m));
      m.addEventListener("mouseleave", hideSharedTooltip);
      m.addEventListener("click", () => {
        const ids = m.dataset.ids.split(",");
        badgesEl.querySelectorAll(".tag-badge").forEach((b) => {
          if (ids.includes(b.dataset.id)) {
            b.classList.add("flash");
            b.scrollIntoView({ block: "nearest", behavior: "smooth" });
            setTimeout(() => b.classList.remove("flash"), 900);
          }
        });
      });
    });

    // --- ordered badge list under the paragraph, in text order ---
    const badgesEl = document.createElement("div");
    badgesEl.className = "badges";
    active.forEach((r) => badgesEl.appendChild(renderBadge(r, locked, excluded)));
    wrap.appendChild(badgesEl);

    // edit panel mount point (appears directly under badges when a badge is clicked)
    const panelMount = document.createElement("div");
    panelMount.className = "panel-mount";
    const openRecord = openPanelId ? active.find((r) => r.id === openPanelId) : null;
    if (openRecord && !recordLocked(openRecord, locked)) {
      panelMount.appendChild(renderEditPanel(openRecord, docName, paragraph));
    }
    wrap.appendChild(panelMount);

    // drag-select handling for add / move. Move is restricted to the tag's
    // own paragraph, and a reviewed (locked) paragraph accepts neither.
    // Deliberately does NOT exclude mousedown on an existing span.quote --
    // Add/Move both need to be able to start a drag from within already-
    // highlighted text (e.g. to reposition next to/over another tag). A
    // plain click (no drag) still resolves to a collapsed selection below
    // and is ignored, so the mark's own click-to-flash handler is unaffected.
    let dragging = false;
    ptext.addEventListener("mousedown", () => {
      if (locked) return;
      if (addMode) {
        dragging = true;
        ptext.classList.add("selecting");
        return;
      }
      if (moveTargetId) {
        const target = state.records.find((r) => r.id === moveTargetId);
        if (target && target.source_name === docName && target.row === paragraph.row) {
          dragging = true;
          ptext.classList.add("selecting");
        }
      }
    });
    document.addEventListener("mouseup", () => {
      if (!dragging) return;
      dragging = false;
      ptext.classList.remove("selecting");
      const sel = window.getSelection();
      if (!sel || sel.isCollapsed || sel.rangeCount === 0) return;
      const range = sel.getRangeAt(0);
      if (!ptext.contains(range.commonAncestorContainer)) return;
      const localStart = rangeOffsetWithin(ptext, range.startContainer, range.startOffset);
      const localEnd = rangeOffsetWithin(ptext, range.endContainer, range.endOffset);
      if (localStart == null || localEnd == null || localStart === localEnd) return;
      const lo = Math.min(localStart, localEnd);
      const hi = Math.max(localStart, localEnd);
      const absStart = base + lo;
      const absEnd = base + hi;
      const phrase = paragraph.text.slice(lo, hi);
      sel.removeAllRanges();

      if (addMode) {
        const tag = addTagInput.value.trim();
        if (!tag) {
          showToast("Enter a tag name before dragging to add it.");
          return;
        }
        const gid = `${docName}-${absStart}-${absEnd}`;
        state.records.push({
          id: `${gid}-${tag}-${nextIdCounter++}`,
          group_id: gid,
          source_name: docName,
          row: paragraph.row,
          phrase,
          tag,
          start: absStart,
          end: absEnd,
          status: "created",
        });
        showToast(`Added "${tag}" on "${phrase}"`);
        persistLocal();
        render();
      } else if (moveTargetId) {
        const r = state.records.find((x) => x.id === moveTargetId);
        if (r) {
          r.start = absStart;
          r.end = absEnd;
          r.phrase = phrase;
          markStatusOnPositionChange(r);
          showToast(`Moved "${r.tag}" to "${phrase}"`);
        }
        moveTargetId = null;
        persistLocal();
        render();
      }
    });

    return wrap;
  }

  function rangeOffsetWithin(container, node, offset) {
    // Marks contain plain text only (no nested tooltip element -- see
    // sharedTooltip), so a plain Range.toString().length is always correct.
    const r = document.createRange();
    r.selectNodeContents(container);
    try {
      r.setEnd(node, offset);
    } catch (e) {
      return null;
    }
    return r.toString().length;
  }

  function flashRecordSpans(recordId) {
    // Opening/closing the editor rebuilds the document DOM. Resolve marks
    // after render() so the flash applies to the visible text.
    const marks = Array.from(docsEl.querySelectorAll("span.quote"))
      .filter((m) => m.dataset.ids.split(",").includes(recordId));
    marks.forEach((m) => m.classList.add("flash"));
    if (marks.length) marks[0].scrollIntoView({ block: "nearest", behavior: "smooth" });
    setTimeout(() => marks.forEach((m) => m.classList.remove("flash")), 900);
  }

  function renderBadge(r, paraLocked, excluded) {
    const badge = document.createElement("span");
    const info = tagInfo(r.tag);
    const locked = recordLocked(r, paraLocked);
    const unlockHint = paraLocked
      ? (excluded ? "uncheck Exclude" : "uncheck Reviewed")
      : "turn off 'Restrict to undefined tags'";
    badge.className = "tag-badge" +
      (openPanelId === r.id ? " open" : "") +
      (locked ? " locked" : "") +
      (info.additional ? " undefined" : "") +
      (info.system ? " system" : "");
    badge.dataset.id = r.id;
    badge.style.backgroundColor = tagColor(r.tag);
    badge.title = r.tag + " (" + STATUS_LABELS[r.status] + ")" + (locked ? ` — ${unlockHint} to edit` : "");
    if (r.status !== "original") {
      const dot = document.createElement("span");
      dot.className = "status-dot";
      dot.style.background = STATUS_COLORS[r.status];
      badge.appendChild(dot);
    }
    badge.appendChild(document.createTextNode(r.tag));
    badge.addEventListener("click", () => {
      if (locked) {
        showToast(`${unlockHint[0].toUpperCase()}${unlockHint.slice(1)} to edit tags in this ${displayLabel.toLowerCase()}.`);
        flashRecordSpans(r.id);
        return;
      }
      openPanelId = openPanelId === r.id ? null : r.id;
      render();
      flashRecordSpans(r.id);
    });
    return badge;
  }

  function renderEditPanel(r, docName, paragraph) {
    const panel = document.createElement("div");
    panel.className = "edit-panel";

    const statusLabel = document.createElement("span");
    statusLabel.className = "status-label";
    statusLabel.style.background = STATUS_COLORS[r.status];
    statusLabel.textContent = STATUS_LABELS[r.status];
    panel.appendChild(statusLabel);

    const pos = document.createElement("span");
    pos.className = "pos";
    pos.textContent = `${r.start}-${r.end}`;
    panel.appendChild(pos);

    const tagSelect = document.createElement("select");
    panel.appendChild(tagSelect);

    const tagInput = document.createElement("input");
    tagInput.type = "text";
    tagInput.className = "tag-input";
    tagInput.setAttribute("list", "tag-options");
    tagInput.value = r.tag;
    tagInput.placeholder = "or type a new tag";
    tagInput.addEventListener("change", () => {
      const newTag = tagInput.value.trim();
      if (newTag && newTag !== r.tag) {
        r.tag = newTag;
        markStatusOnTagChange(r);
        persistLocal();
        render();
      } else {
        tagInput.value = r.tag;
      }
    });
    panel.appendChild(tagInput);

    wireDefinedTagSelect(tagSelect, tagInput, r.tag);

    const spacer = document.createElement("span");
    spacer.className = "spacer";
    panel.appendChild(spacer);

    const moveBtn = document.createElement("button");
    moveBtn.className = "small";
    moveBtn.textContent = "⇲ Move";
    moveBtn.title = `Drag-select the new text range within this ${displayLabel.toLowerCase()}`;
    moveBtn.addEventListener("click", () => {
      addMode = false;
      addToolbar.classList.remove("show");
      document.getElementById("btnAddMode").classList.remove("active");
      moveTargetId = moveTargetId === r.id ? null : r.id;
      showToast(moveTargetId ? `Drag-select a new range within ${displayLabel.toLowerCase()} ${paragraph.paragraph} of ${docName}…` : "Move cancelled.");
      render();
    });
    panel.appendChild(moveBtn);

    const delBtn = document.createElement("button");
    delBtn.className = "small danger";
    delBtn.textContent = "🗑 Delete";
    delBtn.addEventListener("click", () => {
      r.status = "deleted";
      openPanelId = null;
      showToast(`Deleted "${r.tag}"`);
      persistLocal();
      render();
    });
    panel.appendChild(delBtn);

    const closeBtn = document.createElement("button");
    closeBtn.className = "small";
    closeBtn.textContent = "Close";
    closeBtn.addEventListener("click", () => {
      openPanelId = null;
      render();
    });
    panel.appendChild(closeBtn);

    return panel;
  }

  function escapeHtml(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function escapeAttr(s) { return escapeHtml(s).replace(/"/g, "&quot;"); }

  document.getElementById("btnExpandAll").addEventListener("click", () => {
    Object.keys(state.documents).forEach((d) => (manualOverride[d] = true));
    render();
  });
  document.getElementById("btnCollapseAll").addEventListener("click", () => {
    Object.keys(state.documents).forEach((d) => (manualOverride[d] = false));
    render();
  });

  const tagOptions = document.getElementById("tag-options");
  state.tags.forEach((t) => {
    const opt = document.createElement("option");
    opt.value = t;
    tagOptions.appendChild(opt);
  });
  wireDefinedTagSelect(addTagSelectDefined, addTagInput, "");

  // --- generic dropdown-panel open/close (metadata + filters), mirroring
  // compare.html's meta-selector open/close-on-outside-click behavior ---
  function wireDropdownToggle(btnId, panelId) {
    const btn = document.getElementById(btnId);
    const panel = document.getElementById(panelId);
    btn.addEventListener("click", (ev) => {
      ev.stopPropagation();
      const willOpen = !panel.classList.contains("open");
      document.querySelectorAll(".dropdown-panel.open").forEach((p) => p.classList.remove("open"));
      if (willOpen) panel.classList.add("open");
    });
    panel.addEventListener("click", (ev) => ev.stopPropagation());
  }
  document.addEventListener("click", () => {
    document.querySelectorAll(".dropdown-panel.open").forEach((p) => p.classList.remove("open"));
  });
  wireDropdownToggle("metaSelectorBtn", "metaSelectorPanel");

  // --- metadata column selector: toggling a checkbox just flips CSS
  // visibility on already-rendered .para-meta-field spans (no full
  // re-render needed), matching compare.html's applyMetaColumns(). ---
  const metaSelectorPanel = document.getElementById("metaSelectorPanel");
  if (metaColumns.length === 0) {
    metaSelectorPanel.innerHTML = '<div class="empty-hint">No metadata available.</div>';
  } else {
    metaColumns.forEach(({ col, label: colLabel }) => {
      const item = document.createElement("div");
      item.className = "dropdown-check-item";
      const inputId = "meta-col-" + col;
      item.innerHTML = `<input type="checkbox" id="${escapeAttr(inputId)}"><label for="${escapeAttr(inputId)}">${escapeHtml(colLabel)}</label>`;
      item.querySelector("input").addEventListener("change", (ev) => {
        if (ev.target.checked) activeMetaColumns.add(col);
        else activeMetaColumns.delete(col);
        applyMetaColumns();
      });
      metaSelectorPanel.appendChild(item);
    });
  }
  function applyMetaColumns() {
    document.querySelectorAll(".para-meta-field").forEach((el) => {
      el.classList.toggle("show", activeMetaColumns.has(el.dataset.col));
    });
  }

  // --- per-column identity filters: hide non-matching whole documents, so
  // this always goes through a full render() rather than a CSS toggle. One
  // dropdown is built per filterColumns entry (the configured document-key
  // columns, plus condition) -- driven entirely by documentIdentity /
  // filterColumns embedded from the server, so this page makes no
  // assumptions about column names or how many there are. ---
  function refreshFilterBtnLabel(btnId, baseLabel, activeSet) {
    const btn = document.getElementById(btnId);
    btn.textContent = activeSet.size ? `${baseLabel} (${activeSet.size}) ▾` : `${baseLabel} ▾`;
    btn.classList.toggle("active", !!activeSet.size);
  }
  function buildFilterPanel(panelEl, btnId, baseLabel, activeSet, getValue) {
    const values = Array.from(new Set(Object.keys(state.documents).map(getValue).filter((v) => v !== undefined && v !== null && v !== "")));
    values.sort((a, b) =>
      typeof a === "number" && typeof b === "number" ? a - b : String(a).localeCompare(String(b))
    );
    if (values.length === 0) {
      panelEl.innerHTML = '<div class="empty-hint">No documents.</div>';
      return;
    }
    values.forEach((value) => {
      const item = document.createElement("div");
      item.className = "dropdown-check-item";
      const inputId = "filter-" + panelEl.id + "-" + String(value).replace(/\s+/g, "_");
      item.innerHTML = `<input type="checkbox" id="${escapeAttr(inputId)}"><label for="${escapeAttr(inputId)}">${escapeHtml(String(value))}</label>`;
      item.querySelector("input").addEventListener("change", (ev) => {
        if (ev.target.checked) activeSet.add(value);
        else activeSet.delete(value);
        refreshFilterBtnLabel(btnId, baseLabel, activeSet);
        render();
      });
      panelEl.appendChild(item);
    });
  }
  const filterPanelsContainer = document.getElementById("filterPanelsContainer");
  filterColumns.forEach(({ col, label }) => {
    const btnId = "filterBtn-" + col;
    const panelId = "filterPanel-" + col;
    const wrap = document.createElement("div");
    wrap.className = "dropdown-wrap";
    wrap.innerHTML =
      `<button id="${escapeAttr(btnId)}" class="small">Filter ${escapeHtml(label)} ▾</button>` +
      `<div class="dropdown-panel" id="${escapeAttr(panelId)}"></div>`;
    filterPanelsContainer.appendChild(wrap);
    wireDropdownToggle(btnId, panelId);
    buildFilterPanel(
      document.getElementById(panelId),
      btnId,
      "Filter " + label,
      activeFilters.get(col),
      (d) => identityOf(d)[col]
    );
  });

  document.getElementById("btnAddMode").addEventListener("click", () => {
    moveTargetId = null;
    addMode = !addMode;
    addToolbar.classList.toggle("show", addMode);
    document.getElementById("btnAddMode").classList.toggle("active", addMode);
    render();
  });
  document.getElementById("btnCancelAdd").addEventListener("click", () => {
    addMode = false;
    addToolbar.classList.remove("show");
    document.getElementById("btnAddMode").classList.remove("active");
  });

  const btnProtect = document.getElementById("btnProtect");
  function refreshProtectBtn() {
    btnProtect.textContent = "Protect file: " + (state.metadata.protect_file ? "on" : "off");
    btnProtect.classList.toggle("active", !!state.metadata.protect_file);
  }
  btnProtect.addEventListener("click", () => {
    state.metadata.protect_file = !state.metadata.protect_file;
    refreshProtectBtn();
    persistLocal();
    showToast(
      state.metadata.protect_file
        ? "Protected: re-running Step 2 will not overwrite this file."
        : "Unprotected: Step 2 will regenerate this file on next run."
    );
  });
  refreshProtectBtn();

  const btnRestrictTarget = document.getElementById("btnRestrictTarget");
  function refreshRestrictBtn() {
    if (!btnRestrictTarget) return;
    btnRestrictTarget.textContent =
      "Restrict to undefined tags: " + (state.metadata.restrict_to_target_tags ? "on" : "off");
    btnRestrictTarget.classList.toggle("active", !!state.metadata.restrict_to_target_tags);
  }
  if (btnRestrictTarget) {
    btnRestrictTarget.addEventListener("click", () => {
      state.metadata.restrict_to_target_tags = !state.metadata.restrict_to_target_tags;
      refreshRestrictBtn();
      persistLocal();
      render();
    });
  }
  refreshRestrictBtn();

  const btnShowUndefined = document.getElementById("btnShowUndefined");
  const undefinedTagNames = tagList.filter((t) => t.additional_tag).map((t) => t.name).sort();
  if (undefinedTagNames.length === 0) {
    btnShowUndefined.disabled = true;
    btnShowUndefined.title = "No undefined tags";
  } else {
    btnShowUndefined.title = "Undefined tags:\n" + undefinedTagNames.join("\n");
  }
  function refreshShowUndefinedBtn() {
    btnShowUndefined.textContent = "Show undefined tags: " + (state.metadata.render_undefined_tags ? "on" : "off");
    btnShowUndefined.classList.toggle("active", !!state.metadata.render_undefined_tags);
  }
  btnShowUndefined.addEventListener("click", () => {
    state.metadata.render_undefined_tags = !state.metadata.render_undefined_tags;
    refreshShowUndefinedBtn();
    persistLocal();
    render();
  });
  refreshShowUndefinedBtn();

  const btnShowSystem = document.getElementById("btnShowSystem");
  const systemTagNames = tagList.filter((t) => t.system).map((t) => t.name).sort();
  if (systemTagNames.length === 0) {
    btnShowSystem.disabled = true;
    btnShowSystem.title = "No system tags";
  } else {
    btnShowSystem.title = "System tags:\n" + systemTagNames.join("\n");
  }
  function refreshShowSystemBtn() {
    btnShowSystem.textContent = "Show system tags: " + (state.metadata.show_system_tags ? "on" : "off");
    btnShowSystem.classList.toggle("active", !!state.metadata.show_system_tags);
  }
  btnShowSystem.addEventListener("click", () => {
    state.metadata.show_system_tags = !state.metadata.show_system_tags;
    refreshShowSystemBtn();
    persistLocal();
    render();
  });
  refreshShowSystemBtn();

  async function saveToDisk() {
    state.metadata.last_saved_at = new Date().toISOString();
    // Escape "<" + "/" so a literal script-closing sequence inside edited
    // text can never prematurely close this script block when reopened.
    document.getElementById("review-data").textContent = JSON.stringify(
      { metadata: state.metadata, paragraph_checks: state.paragraphChecks, records: state.records },
      null,
      2
    ).replace(/<\//g, "<\\/");
    const htmlText = "<!doctype html>\n" + document.documentElement.outerHTML;
    const suggestedName =
      state.metadata.suggested_filename || `review_interface_general_${state.metadata.prefix}.html`;

    if (window.showSaveFilePicker) {
      try {
        const handle =
          fileHandle ||
          (await window.showSaveFilePicker({
            suggestedName,
            types: [{ description: "HTML file", accept: { "text/html": [".html"] } }],
          }));
        fileHandle = handle;
        const writable = await handle.createWritable();
        await writable.write(htmlText);
        await writable.close();
        document.getElementById("saveStatus").textContent = "Saved to file at " + new Date().toLocaleTimeString();
        showToast("Saved.");
        return;
      } catch (e) {
        if (e && e.name === "AbortError") {
          showToast("Save cancelled.");
          return;
        }
        console.warn("File System Access save failed, falling back to download.", e);
      }
    }
    const blob = new Blob([htmlText], { type: "text/html" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = suggestedName;
    a.click();
    document.getElementById("saveStatus").textContent = "Downloaded a copy — replace the original file with this download.";
    showToast("Downloaded — replace the file manually.");
  }
  document.getElementById("btnSave").addEventListener("click", saveToDisk);

  const banner = document.getElementById("banner");
  const cached = localStorage.getItem(STORAGE_KEY);
  if (cached) {
    try {
      const parsed = JSON.parse(cached);
      banner.classList.add("show");
      document.getElementById("btnRestore").addEventListener("click", () => {
        state.metadata = parsed.metadata;
        state.paragraphChecks = parsed.paragraph_checks;
        state.records = parsed.records;
        banner.classList.remove("show");
        refreshProtectBtn();
        render();
        showToast("Restored autosaved changes from this browser.");
      });
      document.getElementById("btnDiscard").addEventListener("click", () => {
        localStorage.removeItem(STORAGE_KEY);
        banner.classList.remove("show");
      });
    } catch (e) {
      localStorage.removeItem(STORAGE_KEY);
    }
  }

  render();
})();
</script>
</body>
</html>
